name: Bug report
description: Something in Zarvis does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: input
    id: versions
    attributes:
      label: Node version and OS
  - type: markdown
    attributes:
      value: Please remove personal paths, emails and session ids from anything you paste.
